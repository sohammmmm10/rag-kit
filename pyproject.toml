[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "rag-kit"
version = "0.1.0"
description = "Plug-and-play RAG pipeline library for Python. Load, chunk, embed, store, retrieve, and generate — all in one clean API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Soham Dahivalkar" }
]
keywords = ["rag", "retrieval", "augmented", "generation", "llm", "ai", "vector", "embeddings", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typing-extensions>=4.8; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sohammmmm10/rag-kit"
Repository = "https://github.com/sohammmmm10/rag-kit"
Issues = "https://github.com/sohammmmm10/rag-kit/issues"

[project.optional-dependencies]
openai = ["openai>=1.56.0"]
pdf = ["PyPDF2>=3.0.0"]
chromadb = ["chromadb>=0.5.0"]
sentence-transformers = ["sentence-transformers>=3.0.0"]
all = [
  "openai>=1.56.0",
  "PyPDF2>=3.0.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.scripts]
rag-kit = "rag_kit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_kit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
]
